<!DOCTYPE html>

  <head>
    <meta charset="UTF-8" />

    <title>DNCR Checker - Compliance System</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
      body {
        font-family: 'Inter', sans-serif;
        background-color: #f3f4f6;
      }

      @keyframes fade-in {
        from { opacity: 0; }
        to   { opacity: 1; }
      }

      @keyframes fade-in-up {
        from { opacity: 0; transform: translateY(10px); }
        to   { opacity: 1; transform: translateY(0); }
      }

      @keyframes zoom-in {
        from { opacity: 0; transform: scale(0.95); }
        to   { opacity: 1; transform: scale(1); }
      }

      .animate-fade-in    { animation: fade-in 0.2s ease-out both; }
      .animate-fade-in-up { animation: fade-in-up 0.3s ease-out both; }
      .animate-zoom-in    { animation: zoom-in 0.2s ease-out both; }

      @media (prefers-reduced-motion: reduce) {
        .animate-fade-in,
        .animate-fade-in-up,
        .animate-zoom-in { animation: none; }
      }
    </style>
